<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMFY</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COMFY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF6F3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" id="css" href="style.css">
</head>
<body>
<div id="app"><main class="body"><p class="t">COMFY…</p></main></div>
<noscript>COMFY richiede JavaScript.</noscript>
<script>
// Carica sempre l'ultima versione pubblicata: version.json non passa dalla cache e la versione viene aggiunta
// all'indirizzo di tutti i file. Senza connessione si riparte dall'ultima versione salvata (service worker).
try { const th = (JSON.parse(localStorage.getItem('comfy_web_v1') || '{}') || {}).theme; document.documentElement.dataset.theme = th === 'dark' || (th !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
(async () => {
  if ('serviceWorker' in navigator) { try { await navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  let v = null;
  try { v = (await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json()).version; } catch (e) {}
  try { if (v) localStorage.setItem('comfy_last_version', v); else v = localStorage.getItem('comfy_last_version'); } catch (e) {}
  v = v || 'dev';
  document.getElementById('css').href = 'style.css?v=' + v;
  import('./app.js?v=' + v).catch(err => {
    const offline = navigator.onLine === false;
    document.getElementById('app').innerHTML = '<main class="body"><h1>COMFY</h1><p class="t">' + (offline
      ? 'Sei offline e COMFY non è ancora salvato su questo telefono: aprilo una volta con la connessione attiva. / You are offline: open COMFY once with a connection.'
      : 'Errore di avvio: ' + String(err && err.message || err)) + '</p></main>';
  });
})();
</script>
</body>
</html>
