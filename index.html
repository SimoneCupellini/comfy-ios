<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMFY</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COMFY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF6F3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" id="css" href="style.css">
</head>
<body>
<div id="app"><main class="body"><p class="t">COMFY…</p></main></div>
<noscript>COMFY richiede JavaScript.</noscript>
<script>
// Carica sempre l'ultima versione pubblicata: version.json non passa dalla cache, e la versione
// viene aggiunta all'indirizzo di tutti i file, cosi' Safari non usa copie vecchie.
(async () => {
  let v = 'dev';
  try { v = (await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json()).version || v; } catch (e) {}
  document.getElementById('css').href = 'style.css?v=' + v;
  import('./app.js?v=' + v).catch(err => {
    document.getElementById('app').innerHTML = '<main class="body"><h1>COMFY</h1><p class="t">Errore di avvio: ' + String(err && err.message || err) + '</p></main>';
  });
})();
</script>
</body>
</html>
